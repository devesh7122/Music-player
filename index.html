<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Luxury Watch Music Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
    --size: 340px;
}

body{
    margin:0;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:system-ui;
    color:#fff;
}

/* ===== OUTER RGB RING ===== */
.outer-ring{
    width:var(--size);
    height:var(--size);
    border-radius:50%;
    background:conic-gradient(
        red,magenta,blue,cyan,lime,yellow,red
    );
    animation:spin 8s linear infinite;
    padding:6px;
    filter:drop-shadow(0 0 25px #0ff5);
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* ===== STEEL BODY ===== */
.steel-body{
    width:100%;
    height:100%;
    border-radius:50%;
    background:
        radial-gradient(circle at top,#444,#050505 70%);
    box-shadow:
        inset 0 0 40px #000,
        inset 0 10px 20px #fff1,
        0 30px 60px #000;
    position:relative;
    overflow:hidden;
}

/* ===== INNER METAL RING ===== */
.steel-body::before{
    content:"";
    position:absolute;
    inset:18px;
    border-radius:50%;
    background:linear-gradient(145deg,#555,#111);
    box-shadow:
        inset 0 0 20px #000,
        0 0 10px #000;
}

/* ===== VISUALIZER CANVAS ===== */
canvas{
    position:absolute;
    inset:32px;
    border-radius:50%;
}

/* ===== PROGRESS RING ===== */
.progress{
    position:absolute;
    inset:12px;
    border-radius:50%;
    pointer-events:none;
}

/* ===== 3D PLAY BUTTON ===== */
.play-btn{
    position:absolute;
    inset:40%;
    border-radius:50%;
    background:
        radial-gradient(circle at top,#aaa,#222);
    box-shadow:
        inset 0 2px 6px #fff6,
        inset 0 -6px 10px #000,
        0 10px 25px #000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    color:#0ff;
    cursor:pointer;
    user-select:none;
    transition:.15s;
}

.play-btn:active{
    transform:translateY(3px);
    box-shadow:
        inset 0 2px 6px #000,
        inset 0 -2px 4px #fff4,
        0 4px 10px #000;
}

/* ===== INFO ===== */
.info{
    position:absolute;
    bottom:-85px;
    width:100%;
    text-align:center;
    font-size:14px;
    opacity:.85;
    padding:0 15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ===== PICK BUTTON ===== */
.pick{
    position:absolute;
    bottom:-130px;
    left:50%;
    transform:translateX(-50%);
    background:#000;
    color:#0ff;
    border:1px solid #0ff;
    padding:8px 22px;
    border-radius:25px;
    box-shadow:0 0 20px #0ff6;
    font-size:14px;
}

input{display:none}
</style>
</head>

<body>

<div class="outer-ring">
<div class="steel-body" id="dial">

    <canvas id="wave" width="260" height="260"></canvas>
    <canvas id="progress" class="progress" width="316" height="316"></canvas>

    <div class="play-btn" id="btn">▶</div>

    <div class="info" id="info">No track loaded</div>
    <button class="pick" id="pick">Select MP3</button>
    <input type="file" id="file" accept="audio/*">

</div>
</div>

<script>
const audio = new Audio();
const file = document.getElementById("file");
const pick = document.getElementById("pick");
const btn = document.getElementById("btn");
const info = document.getElementById("info");

const wave = document.getElementById("wave");
const wctx = wave.getContext("2d");

const prog = document.getElementById("progress");
const pctx = prog.getContext("2d");

let ctx, analyser, source;

/* FILE PICK */
pick.onclick = ()=>file.click();

file.onchange = e=>{
    const f = e.target.files[0];
    if(!f) return;
    audio.src = URL.createObjectURL(f);
    info.textContent = f.name;
};

/* PLAY */
btn.onclick = ()=>{
    if(!audio.src) return;

    if(!ctx){
        ctx = new (window.AudioContext||webkitAudioContext)();
        analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        source = ctx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(ctx.destination);
        render();
    }

    if(audio.paused){
        audio.play();
        ctx.resume();
        btn.textContent="❚❚";
    }else{
        audio.pause();
        btn.textContent="▶";
    }
};

/* RENDER */
function render(){
    requestAnimationFrame(render);

    if(!analyser) return;
    const data = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(data);

    /* WAVEFORM (CLIPPED) */
    wctx.clearRect(0,0,wave.width,wave.height);
    wctx.beginPath();
    wctx.strokeStyle=`hsl(${Date.now()/30%360},100%,60%)`;
    wctx.lineWidth=2;

    for(let i=0;i<data.length;i++){
        const v=data[i]/128;
        const x=i/data.length*wave.width;
        const y=v*wave.height/2;
        i===0?wctx.moveTo(x,y):wctx.lineTo(x,y);
    }
    wctx.stroke();

    /* PROGRESS */
    pctx.clearRect(0,0,prog.width,prog.height);
    if(audio.duration){
        const angle = audio.currentTime/audio.duration * Math.PI*2;
        pctx.beginPath();
        pctx.strokeStyle="#0ff";
        pctx.lineWidth=4;
        pctx.arc(
            prog.width/2,
            prog.height/2,
            150,
            -Math.PI/2,
            angle - Math.PI/2
        );
        pctx.stroke();
    }
}
</script>

</body>
</html>
