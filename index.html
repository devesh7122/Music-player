<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Beat Music Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<style>
body{
    margin:0;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:system-ui;
    color:#fff;
    overflow:hidden;
}

/* PLAYER */
.player{
    position:relative;
    width:320px;
    height:320px;
    border-radius:50%;
    background:radial-gradient(circle at top,#333,#000);
    box-shadow:0 30px 60px #000,inset 0 0 30px #fff2;
    transition:.15s;
}

/* NEON RGB RING (SHARP FIX) */
.ring{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background:conic-gradient(
        red,magenta,blue,cyan,lime,yellow,red
    );
    animation:spin 6s linear infinite;
    filter:none;                 /* sharp */
    will-change:transform;       /* GPU hint without breaking rotation */
}

.ring::after{
    content:"";
    position:absolute;
    inset:14px;                  /* match thickness */
    background:#000;
    border-radius:50%;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* CENTER BUTTON */
.center{
    position:absolute;
    inset:38%;
    border-radius:50%;
    background:radial-gradient(circle at top,#777,#111);
    box-shadow:
        inset 0 0 10px #fff5,
        0 10px 20px #000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    color:#0ff;
    cursor:pointer;
    user-select:none;
}
.center:active{transform:scale(.9)}

/* BEAT PULSE */
.pulse{animation:pulse .3s ease}
@keyframes pulse{50%{transform:scale(1.08)}}

/* CANVAS WAVE */
canvas{
    position:absolute;
    inset:20px;
    border-radius:50%;
    overflow:hidden;
}

/* INFO */
.info{
    position:absolute;
    bottom:-90px;
    width:100%;
    text-align:center;
    font-size:14px;
    opacity:.8;
    padding:0 10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* PICK BUTTON */
.pick{
    position:absolute;
    bottom:-135px;
    left:50%;
    transform:translateX(-50%);
    background:transparent;
    color:#0ff;
    border:1px solid #0ff;
    padding:8px 20px;
    border-radius:25px;
    font-size:14px;
    box-shadow:0 0 15px #0ff7;
    cursor:pointer;
}
.pick:active{transform:translateX(-50%) scale(.95)}

input{display:none}
</style>
</head>

<body>

<div class="player" id="player">
    <div class="ring"></div>

    <canvas id="wave" width="280" height="280"></canvas>

    <div class="center" id="btn">▶</div>

    <div class="info" id="info">No track loaded</div>

    <button class="pick" id="pick">Select MP3</button>
    <input type="file" id="file" accept="audio/*">
</div>

<script>
const audio = new Audio();
const file = document.getElementById("file");
const pick = document.getElementById("pick");
const btn = document.getElementById("btn");
const info = document.getElementById("info");
const canvas = document.getElementById("wave");
const ctx2d = canvas.getContext("2d");
const player = document.getElementById("player");

let ctx, analyser, source;

/* OPEN FILE PICKER */
pick.onclick = () => file.click();

/* LOAD AUDIO */
file.onchange = e=>{
    const f = e.target.files[0];
    if(!f) return;
    audio.src = URL.createObjectURL(f);
    info.textContent = f.name;
};

/* PLAY / PAUSE */
btn.onclick = ()=>{
    if(!audio.src) return;

    if(!ctx){
        ctx = new (window.AudioContext||webkitAudioContext)();
        analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        source = ctx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(ctx.destination);
        draw();
    }

    if(audio.paused){
        audio.play();
        ctx.resume();
        btn.textContent="❚❚";
    }else{
        audio.pause();
        btn.textContent="▶";
    }
};

/* WAVEFORM + BEAT SYNC */
function draw(){
    requestAnimationFrame(draw);
    if(!analyser) return;

    const data = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(data);

    ctx2d.clearRect(0,0,canvas.width,canvas.height);

    ctx2d.save();
    ctx2d.beginPath();
    ctx2d.arc(
        canvas.width/2,
        canvas.height/2,
        canvas.width/2 - 4,
        0,
        Math.PI * 2
    );
    ctx2d.clip();

    ctx2d.beginPath();
    ctx2d.lineWidth = 2;
    ctx2d.strokeStyle = `hsl(${Date.now()/25%360},100%,60%)`;

    let sum = 0;
    for(let i=0;i<data.length;i++){
        const v = data[i]/128;
        const x = i/data.length * canvas.width;
        const y = v*(canvas.height*0.35) + canvas.height*0.15;

        i===0 ? ctx2d.moveTo(x,y) : ctx2d.lineTo(x,y);
        sum += Math.abs(v-1);
    }

    ctx2d.stroke();
    ctx2d.restore();

    if(sum > 180){
        player.classList.add("pulse");
        setTimeout(()=>player.classList.remove("pulse"),80);
    }
}
</script>

</body>
</html>
