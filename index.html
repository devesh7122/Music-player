<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Beat Music Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:system-ui;
    color:#fff;
    overflow:hidden;
}

/* PLAYER */
.player{
    position:relative;
    width:320px;
    height:320px;
    border-radius:50%;
    background:radial-gradient(circle at top,#222,#000);
    box-shadow:0 30px 60px #000,inset 0 0 30px #fff2;
    transition:transform .15s ease-out;
}

/* SHARP RGB RING */
.ring{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background:conic-gradient(
        red,magenta,blue,cyan,lime,yellow,red
    );
    animation:spin 6s linear infinite;
}
.ring::after{
    content:"";
    position:absolute;
    inset:14px;
    background:#000;
    border-radius:50%;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* MODERN CENTER BUTTON */
.center{
    position:absolute;
    inset:40%;
    border-radius:50%;
    background:
        radial-gradient(circle at 30% 30%,#444,#111);
    backdrop-filter:blur(6px);
    box-shadow:
        0 0 25px #0ff6,
        inset 0 0 12px #fff4;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    z-index:3;
}
.center::before{
    content:"";
    width:18px;
    height:18px;
    border-left:5px solid #0ff;
    border-right:5px solid #0ff;
}
.center.play::before{
    width:0;
    height:0;
    border:none;
    border-left:18px solid #0ff;
    border-top:10px solid transparent;
    border-bottom:10px solid transparent;
}
.center:active{transform:scale(.92)}

/* CANVAS */
canvas{
    position:absolute;
    inset:20px;
    border-radius:50%;
}

/* INFO */
.info{
    position:absolute;
    bottom:-90px;
    width:100%;
    text-align:center;
    font-size:14px;
    opacity:.8;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* PICK */
.pick{
    position:absolute;
    bottom:-135px;
    left:50%;
    transform:translateX(-50%);
    background:transparent;
    color:#0ff;
    border:1px solid #0ff;
    padding:8px 20px;
    border-radius:25px;
    box-shadow:0 0 18px #0ff8;
}
input{display:none}
</style>
</head>

<body>

<div class="player" id="player">
    <div class="ring"></div>
    <canvas id="wave" width="280" height="280"></canvas>
    <div class="center play" id="btn"></div>
    <div class="info" id="info">No track loaded</div>
    <button class="pick" id="pick">Select MP3</button>
    <input type="file" id="file" accept="audio/*">
</div>

<script>
const audio = new Audio();
const file = document.getElementById("file");
const pick = document.getElementById("pick");
const btn = document.getElementById("btn");
const info = document.getElementById("info");
const canvas = document.getElementById("wave");
const ctx2d = canvas.getContext("2d");
const player = document.getElementById("player");

let ctx, analyser, source;
let bassSmooth = 0;

/* FILE PICK */
pick.onclick = ()=>file.click();
file.onchange = e=>{
    const f = e.target.files[0];
    if(!f) return;
    audio.src = URL.createObjectURL(f);
    info.textContent = f.name;
};

/* PLAY */
btn.onclick = ()=>{
    if(!audio.src) return;

    if(!ctx){
        ctx = new (window.AudioContext||webkitAudioContext)();
        analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.6;
        source = ctx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(ctx.destination);
        draw();
    }

    if(audio.paused){
        audio.play();
        ctx.resume();
        btn.classList.remove("play");
    }else{
        audio.pause();
        btn.classList.add("play");
    }
};

/* PERFECT MUSIC SYNC */
function draw(){
    requestAnimationFrame(draw);
    if(!analyser) return;

    const timeData = new Uint8Array(analyser.fftSize);
    const freqData = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteTimeDomainData(timeData);
    analyser.getByteFrequencyData(freqData);

    /* REAL BASS (first 12 bins) */
    let bass = 0;
    for(let i=0;i<12;i++) bass += freqData[i];
    bass /= 12;
    bassSmooth += (bass - bassSmooth) * 0.15;

    /* ZOOM ON BASS */
    const zoom = 1 + bassSmooth / 900;
    player.style.transform = `scale(${zoom})`;

    /* GLOW TRAIL */
    ctx2d.fillStyle = "rgba(0,0,0,0.2)";
    ctx2d.fillRect(0,0,canvas.width,canvas.height);

    ctx2d.save();
    ctx2d.beginPath();
    ctx2d.arc(
        canvas.width/2,
        canvas.height/2,
        canvas.width/2 - 4,
        0,
        Math.PI * 2
    );
    ctx2d.clip();

    ctx2d.beginPath();
    ctx2d.lineWidth = 2;
    ctx2d.strokeStyle = `hsl(${Date.now()/25%360},100%,60%)`;
    ctx2d.shadowBlur = 20;
    ctx2d.shadowColor = ctx2d.strokeStyle;

    for(let i=0;i<timeData.length;i++){
        const v = timeData[i] / 128;
        const x = i / timeData.length * canvas.width;

        /* WAVE AMPLIFIED BY BASS */
        const y =
            v * (canvas.height * (0.25 + bassSmooth/600)) +
            canvas.height * 0.25;

        i===0 ? ctx2d.moveTo(x,y) : ctx2d.lineTo(x,y);
    }

    ctx2d.stroke();
    ctx2d.restore();
}
</script>

</body>
</html>
