<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Beat Music Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:system-ui;
    color:#fff;
    overflow:hidden;
}

/* PLAYER */
.player{
    position:relative;
    width:320px;
    height:320px;
    border-radius:50%;
    background:radial-gradient(circle at top,#333,#000);
    box-shadow:0 30px 60px #000,inset 0 0 30px #fff2;
}

/* NEON RING */
.ring{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    background:conic-gradient(
        red,magenta,blue,cyan,lime,yellow,red
    );
    animation:spin 6s linear infinite;
    filter:blur(2px);
}
.ring::after{
    content:"";
    position:absolute;
    inset:10px;
    background:#000;
    border-radius:50%;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* CENTER BUTTON */
.center{
    position:absolute;
    inset:38%;
    border-radius:50%;
    background:radial-gradient(circle at top,#777,#111);
    box-shadow:
        inset 0 0 10px #fff5,
        0 10px 20px #000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    color:#0ff;
    cursor:pointer;
    transition:.15s;
}
.center:active{transform:scale(.9)}

/* BEAT PULSE */
.pulse{
    animation:pulse .4s ease;
}
@keyframes pulse{
    50%{transform:scale(1.08)}
}

/* CANVAS */
canvas{
    position:absolute;
    inset:20px;
}

/* INFO */
.info{
    position:absolute;
    bottom:-90px;
    width:100%;
    text-align:center;
    font-size:14px;
    opacity:.8;
}

/* FILE INPUT */
label{
    position:absolute;
    bottom:-130px;
    left:50%;
    transform:translateX(-50%);
    color:#0ff;
    border:1px solid #0ff;
    padding:6px 14px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 0 10px #0ff6;
}
input{display:none}

</style>
</head>

<body>

<div class="player" id="player">
    <div class="ring"></div>
    <canvas id="wave"></canvas>
    <div class="center" id="btn">▶</div>

    <div class="info" id="info">
        No track loaded
    </div>

    <label for="file">Select MP3</label>
    <input type="file" id="file" accept="audio/mp3">
</div>

<script>
const audio = new Audio();
const file = document.getElementById("file");
const btn = document.getElementById("btn");
const info = document.getElementById("info");
const canvas = document.getElementById("wave");
const ctx2d = canvas.getContext("2d");
const player = document.getElementById("player");

let ctx, analyser, source;
canvas.width = 280;
canvas.height = 280;

/* LOAD FILE */
file.onchange = e=>{
    const f = e.target.files[0];
    audio.src = URL.createObjectURL(f);
    info.textContent = f.name;
};

/* PLAY / PAUSE */
btn.onclick = ()=>{
    if(!audio.src) return;

    if(!ctx){
        ctx = new (window.AudioContext||webkitAudioContext)();
        analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        source = ctx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(ctx.destination);
        draw();
    }

    if(audio.paused){
        audio.play();
        ctx.resume();
        btn.textContent="❚❚";
    }else{
        audio.pause();
        btn.textContent="▶";
    }
};

/* WAVEFORM + BEAT SYNC */
function draw(){
    requestAnimationFrame(draw);
    const data = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(data);

    ctx2d.clearRect(0,0,canvas.width,canvas.height);
    ctx2d.beginPath();
    ctx2d.strokeStyle=`hsl(${Date.now()/20%360},100%,60%)`;
    ctx2d.lineWidth=2;

    let sum=0;
    for(let i=0;i<data.length;i++){
        const v = data[i]/128;
        const x = (i/data.length)*canvas.width;
        const y = (v*canvas.height/2);
        i===0 ? ctx2d.moveTo(x,y) : ctx2d.lineTo(x,y);
        sum += Math.abs(v-1);
    }
    ctx2d.stroke();

    /* BEAT PULSE */
    if(sum>200){
        player.classList.add("pulse");
        setTimeout(()=>player.classList.remove("pulse"),100);
    }
}
</script>

</body>
</html>
