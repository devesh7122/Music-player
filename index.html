<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Beat Music Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:system-ui;
    color:#fff;
    overflow:hidden;
}

/* PLAYER */
.player{
    position:relative;
    width:320px;
    height:320px;
    border-radius:50%;
    background:radial-gradient(circle at top,#333,#000);
    box-shadow:0 30px 60px #000,inset 0 0 30px #fff2;
    transition:.15s;
}

/* HD RGB RING (NO BLUR) */
.ring{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background:conic-gradient(
        red,magenta,blue,cyan,lime,yellow,red
    );
    animation:spin 6s linear infinite;
    filter:none; /* FIX: removed blur */
}
.ring::after{
    content:"";
    position:absolute;
    inset:14px;
    background:#000;
    border-radius:50%;
}

/* dynamic thickness */
.ring.dynamic::after{
    inset: var(--ringInset, 14px);
}

@keyframes spin{to{transform:rotate(360deg)}}

/* CENTER BUTTON */
.center{
    position:absolute;
    inset:38%;
    border-radius:50%;
    background:radial-gradient(circle at top,#777,#111);
    box-shadow: inset 0 0 10px #fff5, 0 10px 20px #000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    color:#0ff;
    cursor:pointer;
    z-index:3;
}
.center:active{transform:scale(.9)}

/* CANVAS */
canvas{
    position:absolute;
    inset:18px;
    border-radius:50%;
}

/* INFO + PICK */
.info{
    position:absolute;
    bottom:-90px;
    width:100%;
    text-align:center;
    font-size:14px;
    opacity:.8;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.pick{
    position:absolute;
    bottom:-135px;
    left:50%;
    transform:translateX(-50%);
    background:transparent;
    color:#0ff;
    border:1px solid #0ff;
    padding:8px 20px;
    border-radius:25px;
    font-size:14px;
    box-shadow:0 0 15px #0ff7;
}
input{display:none}
</style>
</head>

<body>

<div class="player" id="player">
    <div class="ring" id="ring"></div>
    <canvas id="wave"></canvas>
    <div class="center" id="btn">▶</div>
    <div class="info" id="info">No track loaded</div>
    <button class="pick" id="pick">Select MP3</button>
    <input type="file" id="file" accept="audio/*">
</div>

<script>
const audio = new Audio();
const file = document.getElementById("file");
const pick = document.getElementById("pick");
const btn = document.getElementById("btn");
const info = document.getElementById("info");
const canvas = document.getElementById("wave");
const ctx2d = canvas.getContext("2d");
const ring = document.getElementById("ring");

let ctx, analyser, source;
canvas.width = canvas.height = 280;

/* FILE PICK */
pick.onclick = ()=>file.click();
file.onchange = e=>{
    const f = e.target.files[0];
    if(!f) return;
    audio.src = URL.createObjectURL(f);
    info.textContent = f.name;
};

/* PLAY */
btn.onclick = ()=>{
    if(!audio.src) return;
    if(!ctx){
        ctx = new (window.AudioContext||webkitAudioContext)();
        analyser = ctx.createAnalyser();
        analyser.fftSize = 256;
        source = ctx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(ctx.destination);
        draw();
    }
    audio.paused ? (audio.play(),ctx.resume(),btn.textContent="❚❚") :
                   (audio.pause(),btn.textContent="▶");
};

/* VISUALIZER */
function draw(){
    requestAnimationFrame(draw);
    if(!analyser) return;

    const freq = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(freq);

    /* glow trail */
    ctx2d.fillStyle = "rgba(0,0,0,0.15)";
    ctx2d.fillRect(0,0,canvas.width,canvas.height);

    ctx2d.save();
    ctx2d.translate(canvas.width/2,canvas.height/2);

    const bars = 64;
    let bass = 0;

    for(let i=0;i<bars;i++){
        const val = freq[i];
        bass += val;

        const angle = (i/bars)*Math.PI*2;
        const h = val*0.35;
        ctx2d.rotate(angle);

        ctx2d.beginPath();
        ctx2d.strokeStyle = `hsl(${i*6 + Date.now()/30},100%,60%)`;
        ctx2d.lineWidth = 3;
        ctx2d.shadowBlur = 15;
        ctx2d.shadowColor = ctx2d.strokeStyle;

        ctx2d.moveTo(0, -90);
        ctx2d.lineTo(0, -90-h);
        ctx2d.stroke();
        ctx2d.rotate(-angle);
    }

    ctx2d.restore();

    /* bass reactive ring */
    bass /= bars;
    const inset = 14 - bass/60;
    ring.style.setProperty("--ringInset", inset+"px");
    ring.classList.add("dynamic");

    /* mobile vibration */
    if(bass > 160 && navigator.vibrate){
        navigator.vibrate(10);
    }
}
</script>

</body>
</html>
